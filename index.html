<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D2A6E">
<title>Papan Slot TravelMlg (dummy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#1E1B3A; --ink-2:#55527A; --line:#E4E2F5;
  --bg:#F7F6FF; --card:#FFFFFF; --mist:#EEEDFF;
  --night:#2D2A6E; --night-2:#3B3596; --night-3:#4C45B5;
  --indigo:#3D35D1; --indigo-dk:#2C25A8;
  --sun:#FF8A3D; --sun-tint:#FFE8D9; --sun-ink:#8A3B0A;
  --sky:#2F7BEA; --sky-tint:#E1EEFF; --sky-ink:#1B4F9C;
  --rose:#E2436E; --rose-tint:#FFE3EA; --rose-ink:#A3123F;
  --amber:#F2B21B; --amber-tint:#FFF1CC; --amber-ink:#6E4A00;
  --leaf:#12946B; --leaf-tint:#DDF5EC; --leaf-ink:#0B5F45;
  --grey-tint:#EDECF3; --grey-ink:#4E4C63;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#DCD9F7;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--indigo)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.device{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .device{height:min(900px,calc(100dvh - 48px));width:420px;border-radius:40px;box-shadow:0 30px 80px rgba(45,42,110,.35),0 0 0 10px #1E1B3A}
}
#app{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scroll-behavior:smooth}
#app.no-tab{padding-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{background:var(--night);color:#fff;position:relative;padding:20px 20px 0}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-dot{width:26px;height:26px;border-radius:9px;background:var(--sun);display:grid;place-items:center;color:var(--night)}
.icon-btn{width:44px;height:44px;border-radius:14px;border:none;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;position:relative}
.icon-btn .badge{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--night)}
.hero h1{margin:18px 0 4px;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:#CFCCF7;font-size:14px}
.hero svg.ridge{display:block;width:calc(100% + 40px);margin:6px -20px 0;height:auto}
.demo-tag{font-size:11px;font-weight:700;background:var(--sun-tint);color:var(--sun-ink);padding:5px 9px;border-radius:999px;white-space:nowrap}

/* page header (non-hero) */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 20px 10px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.wrap{padding:0 20px}
.sub{color:var(--ink-2);font-size:14px;margin:0 20px 14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:-36px 20px 0;position:relative;z-index:2}
.stat{background:var(--card);border-radius:var(--r-md);padding:12px;border:1px solid var(--line)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-2);line-height:1.3;display:block}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 20px 0}
.quick a{text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;text-align:center;min-height:96px;justify-content:center}
.qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.qi.sun{background:var(--sun-tint);color:var(--sun-ink)}
.qi.sky{background:var(--sky-tint);color:var(--sky-ink)}
.qi.rose{background:var(--rose-tint);color:var(--rose-ink)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 20px 10px}
.section-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.section-h a{font-size:13px;font-weight:700;text-decoration:none}

/* date strip */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 58px;height:68px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.date small{font-size:12px;color:var(--ink-2)}
.date b{font-size:19px;font-weight:800}
.date[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.date[aria-pressed="true"] small{color:#D9D6FF}
.date .wk{width:5px;height:5px;border-radius:50%;background:var(--sun)}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 2px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .sw{width:9px;height:9px;border-radius:50%}

/* ticket card */
.tickets{display:flex;flex-direction:column;gap:14px;padding:0 20px}
.ticket{display:block;text-decoration:none;color:var(--ink);background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);position:relative;overflow:hidden}
.t-band{padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t-band.sky{background:var(--sky-tint)} .t-band.rose{background:var(--rose-tint)} .t-band.amber{background:var(--amber-tint)} .t-band.leaf{background:var(--leaf-tint)}
.t-route{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.t-band.sky .t-route{color:var(--sky-ink)} .t-band.rose .t-route{color:var(--rose-ink)} .t-band.amber .t-route{color:var(--amber-ink)} .t-band.leaf .t-route{color:var(--leaf-ink)}
.t-route .arrow{font-size:16px;color:var(--ink)}
.t-time{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink);text-align:right}
.t-time small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:4px}
.t-perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 14px}
.t-perf::before,.t-perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.t-perf::before{left:-25px} .t-perf::after{right:-25px}
.t-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.t-meta{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.t-meta div{display:flex;align-items:center;gap:7px}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seats{display:flex;gap:4px;align-items:center}
.seats i{width:11px;height:11px;border-radius:4px;background:var(--leaf)}
.seats i.full{background:#D6D4E8}
.seat-txt{font-size:12px;color:var(--ink-2);margin-left:6px}

.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.open{background:var(--leaf-tint);color:var(--leaf-ink)}
.pill.few{background:var(--amber-tint);color:var(--amber-ink)}
.pill.full{background:var(--grey-tint);color:var(--grey-ink)}
.pill.wait{background:var(--rose-tint);color:var(--rose-ink)}
.pill.sun{background:var(--sun-tint);color:var(--sun-ink)}
.pill.sky{background:var(--sky-tint);color:var(--sky-ink)}

/* forms */
.form{display:flex;flex-direction:column;gap:16px;padding:4px 20px 24px}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lbl{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--ink-2)}
.input{min-height:50px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);font-size:15px;width:100%}
textarea.input{padding:12px 14px;min-height:76px;resize:vertical}
.input:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 4px rgba(61,53,209,.15)}
.input[aria-invalid="true"]{border-color:var(--rose)}
.err{font-size:12px;color:var(--rose-ink);font-weight:600}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--mist);padding:5px;border-radius:14px}
.seg button{min-height:44px;border:none;border-radius:10px;background:transparent;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(30,27,58,.12)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:6px}
.stepper button{width:46px;height:46px;border-radius:11px;border:none;font-size:22px;font-weight:700}
.stepper .minus{background:var(--mist)} .stepper .plus{background:var(--indigo);color:#fff}
.stepper output{display:flex;flex-direction:column;align-items:center;font-size:24px;font-weight:800}
.stepper output small{font-size:12px;font-weight:500;color:var(--ink-2)}

.btn{min-height:54px;border-radius:16px;border:none;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;padding:0 18px}
.btn.primary{background:var(--indigo);color:#fff}
.btn.primary:active{background:var(--indigo-dk)}
.btn.sun{background:var(--sun);color:var(--night)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:46px;font-size:14px;border-radius:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* calc card */
.calc{background:var(--night);color:#fff;border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden}
.calc .k{font-size:13px;color:#CFCCF7}
.calc .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px}
.calc .steps{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;gap:8px;font-size:13px}
.calc .steps li{display:flex;justify-content:space-between;gap:10px}
.calc .steps b{font-weight:700}
.calc .sunball{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--sun);opacity:.9}
.calc .demo-tag{position:relative}

/* detail */
.d-head{margin:0 20px;background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;padding:14px 16px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;text-align:right}
.seatmap{margin:0 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.seatmap .car{border:2px solid var(--line);border-radius:26px 26px 14px 14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;max-width:250px;margin:6px auto 0}
.seatrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seat{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800}
.seat.free{background:var(--leaf-tint);color:var(--leaf-ink);border:1.5px dashed var(--leaf)}
.seat.taken{background:var(--indigo);color:#fff}
.seat.drv{background:var(--grey-tint);color:var(--grey-ink);font-size:11px}
.seat.blank{visibility:hidden}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

.list{margin:0 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:60px}
.li:first-child{border-top:none}
.av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
.av.sky{background:var(--sky-tint);color:var(--sky-ink)} .av.rose{background:var(--rose-tint);color:var(--rose-ink)} .av.amber{background:var(--amber-tint);color:var(--amber-ink)} .av.leaf{background:var(--leaf-tint);color:var(--leaf-ink)} .av.sun{background:var(--sun-tint);color:var(--sun-ink)} .av.indigo{background:var(--mist);color:var(--indigo)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .grow b{font-size:14px;font-weight:700}
.li .grow span{font-size:12px;color:var(--ink-2)}
.li.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sun);margin-left:6px;vertical-align:middle}

.empty{margin:8px 20px;padding:28px 20px;text-align:center;background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{font-size:16px}
.empty p{margin:0;font-size:14px;color:var(--ink-2)}

.note{margin:14px 20px 0;font-size:12px;color:var(--ink-2);line-height:1.5}

/* match */
.match{background:var(--card);border-radius:var(--r-lg);border:1.5px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.match.best{border:2px solid var(--leaf)}
.match.late{border-style:dashed;opacity:.75}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-time{font-size:26px;font-weight:800;letter-spacing:-.02em}
.req-sum{margin:0 20px 14px;background:var(--mist);border-radius:var(--r-md);padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.req-sum b{font-size:14px}

/* ticket confirmation */
.pass{margin:0 20px;border-radius:26px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.pass-top{background:var(--night);color:#fff;padding:20px;position:relative;overflow:hidden}
.pass-top .code{font-size:13px;color:#CFCCF7}
.pass-top .code b{display:block;color:#fff;font-size:28px;letter-spacing:.06em;margin-top:2px}
.pass-top .ok{display:inline-flex;align-items:center;gap:6px;background:var(--leaf);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;margin-top:10px}
.pass .t-perf::before,.pass .t-perf::after{background:var(--bg)}

/* tabbar */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px env(safe-area-inset-bottom)}
#tabbar[hidden]{display:none}
#tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink-2);font-size:11px;font-weight:600;min-height:56px;justify-content:center}
#tabbar a[aria-current="page"]{color:var(--indigo);font-weight:800}
#tabbar .fab{width:58px;height:58px;border-radius:20px;background:var(--sun);color:var(--night);border:none;display:grid;place-items:center;margin:-28px auto 0;box-shadow:0 8px 20px rgba(255,138,61,.45)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(30,27,58,.45);z-index:20;display:flex;align-items:flex-end}
.scrim[hidden]{display:none}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:10px 20px 28px;display:flex;flex-direction:column;gap:10px;animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet h2{margin:0 0 4px;font-size:18px;font-weight:800}
.sheet a{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);padding:12px;border-radius:16px;border:1px solid var(--line)}
.sheet a span{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2)}
.sheet a span b{font-size:15px;color:var(--ink)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

#toast{position:absolute;left:20px;right:20px;bottom:98px;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s}
#toast.show{transform:none;opacity:1}

/* welcome */
.welcome{min-height:100%;background:var(--night);color:#fff;display:flex;flex-direction:column}
.welcome .w-top{padding:28px 24px 0}
.welcome h1{font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:26px 0 10px}
.welcome p{color:#CFCCF7;margin:0;font-size:15px;line-height:1.55;max-width:32ch}
.welcome svg{display:block;width:100%;height:auto;margin-top:auto}
.roles{background:var(--bg);color:var(--ink);padding:6px 20px 28px;display:flex;flex-direction:column;gap:10px}
.roles .note{color:var(--ink-2)}
.roles h2{margin:0 0 4px;font-size:15px;font-weight:800}
.role{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);text-align:left;width:100%}
.role span{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2)}
.role span b{font-size:16px;color:var(--ink)}

.setting{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.setting:first-child{border-top:none}
.setting label{font-size:14px;font-weight:600}
.setting label small{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.setting input{min-height:44px;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="device">
  <main id="app" aria-live="polite"></main>
  <nav id="tabbar" aria-label="Menu utama" hidden></nav>
  <div class="scrim" id="scrim" hidden></div>
  <div id="toast" role="status"></div>
</div>
<script>
/* ---------- Ikon (garis) ---------- */
const I = {
  bell:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  board:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  car:'<path d="M5 17h14M6 17v2M18 17v2M4 13l2-5a2 2 0 0 1 1.9-1.3h8.2A2 2 0 0 1 18 8l2 5v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',

const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- Utilitas ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hhmm = min => { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); };
const jam = t => (typeof t === 'number' ? hhmm(t) : t).replace(':', '.');
const durasi = m => { const h = Math.floor(m / 60), r = m % 60; return [h ? h + ' jam' : '', r ? r + ' mnt' : ''].filter(Boolean).join(' '); };
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dayKey(d); };
const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const HARI_P = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const TODAY = dayKey(new Date());
const isWeekend = k => [0, 6].includes(fromKey(k).getDay());
const tgl = k => { const d = fromKey(k); return `${HARI_P[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`; };
const tglRel = k => k === TODAY ? 'Hari ini' : k === addDays(TODAY, 1) ? 'Besok' : tgl(k);
const initial = n => n.replace(/^(Pak|Bu|Mas|Mbak)\s+/i, '').charAt(0).toUpperCase();

const ROUTES = {
  'mlg-sub': { from: 'Malang', to: 'Bandara Juanda', color: 'sky', short: 'Malang → Juanda' },
  'sub-mlg': { from: 'Bandara Juanda', to: 'Malang', color: 'sky', short: 'Juanda → Malang' },
  'mlg-kdr': { from: 'Malang', to: 'Kediri', color: 'rose', short: 'Malang → Kediri' },

function seed() {

  const S = (id, route, d, time, taken, op, driver, plate, area) => ({ id, route, date: k(d), time, seats: 7, taken: n(taken), op, driver, plate, area, status: 'open', note: '' });
  return {
    role: null,

      S('s1', 'mlg-sub', 0, '05:30', 4, 'Travel Mitra A', 'Pak Slamet', 'N 7xxx AB', 'Lowokwaru, Klojen'),

      S('s12', 'sub-mlg', 2, '16:00', 2, 'Travel Mitra B', 'Mas Rizal', 'N 3xxx EF', 'Kota Batu'),
      S('s13', 'mlg-kdr', 3, '07:00', 0, 'Travel Mitra B', 'Mas Rizal', 'N 3xxx EF', 'Sukun, Klojen')
    ],
    bookings: [
      { id: 'b0', code: 'TM-4821', name: 'Pak Wahyu', phone: '08xx-xxxx-xxxx', area: 'Lowokwaru', route: 'mlg-sub', date: addDays(TODAY, -1), time: '06:30', op: 'Travel Mitra A', driver: 'Pak Slamet', flight: '11:30', kind: 'dom', status: 'done' }
    ],
    notifs: [
      { id: 'n1', title: 'Slot 08.30 Malang → Juanda tinggal 3 kursi', body: 'Travel Mitra A · hari ini', unread: true, link: '#/slot/s2', tone: 'sky' },

      { id: 'n3', title: 'Travel Mitra D menunggu verifikasi izin', body: 'Slotnya belum tampil untuk penumpang umum', unread: false, link: '#/akun', tone: 'sun' }
    ],

  };
}
const KEY = 'travelmlg-dummy-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
if (!S.slots || !S.slots.length || S.seedDay !== TODAY) { const r = S.role; S = seed(); S.role = r; S.seedDay = TODAY; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
save();

/* ---------- Logika ---------- */
const free = s => s.seats - s.taken.length;
const opVerified = name => (OPS.find(o => o.name === name) || {}).verified !== false;
const statusPill = s => {
  if (s.status === 'closed') return '<span class="pill full">Ditutup</span>';
  const f = free(s);
  if (f === 0) return '<span class="pill full">Terisi</span>';
  if (f === 1) return '<span class="pill few">Tinggal 1</span>';
  return '<span class="pill open">Terbuka</span>';
};
const seatDots = s => `<div class="seats" aria-label="${free(s)} dari ${s.seats} kursi kosong">${Array.from({ length: s.seats }, (_, i) => `<i class="${i < s.taken.length ? 'full' : ''}"></i>`).join('')}<span class="seat-txt">${free(s) ? free(s) + ' kursi kosong' : 'Penuh'}</span></div>`;
function calc(r) {
  const buf = r.kind === 'int' ? S.settings.bufInt : S.settings.bufDom;
  const wk = isWeekend(r.date);
  const travel = S.settings.base + (wk ? S.settings.weekendAdd : 0);
  const arrive = toMin(r.flight) - buf;
  const depart = arrive - travel;
  return { buf, wk, travel, arrive, depart };
}
const routeArea = s => ROUTES[s.route].from === 'Bandara Juanda' ? 'Antar ke' : 'Jemput di';

  const r = S.req, c = calc(r);
  const days = Array.from({ length: 7 }, (_, i) => addDays(TODAY, i));
  return `${topbar('Penumpang ke bandara', '#/beranda')}
  <p class="sub">Masukkan jadwal pesawat. Sistem menghitung jam berangkat dari Malang.</p>
  <form class="form" id="f-minta" novalidate>
    <div class="row2">
      <div class="field"><label for="r-name">Nama penumpang</label><input class="input" id="r-name" value="${esc(r.name)}" aria-describedby="r-name-e"><span class="err" id="r-name-e" hidden>Isi nama penumpang.</span></div>
      <div class="field"><label for="r-phone">No. HP</label><input class="input" id="r-phone" inputmode="tel" placeholder="08…" value="${esc(r.phone)}"></div>
    </div>
    <div class="field"><label for="r-area">Alamat / area jemput</label><input class="input" id="r-area" value="${esc(r.area)}" aria-describedby="r-area-e"><span class="err" id="r-area-e" hidden>Isi area jemput.</span></div>
    <div class="row2">
      <div class="field"><label for="r-date">Tanggal terbang</label><select class="input" id="r-date">${days.map(k => `<option value="${k}" ${k === r.date ? 'selected' : ''}>${fromKey(k).getDate()} ${BLN[fromKey(k).getMonth()]} (${HARI[fromKey(k).getDay()]})</option>`).join('')}</select></div>
      <div class="field"><label for="r-flight">Jam pesawat</label><input class="input" id="r-flight" type="time" value="${r.flight}"></div>
    </div>
    <div class="field"><span class="lbl">Jenis penerbangan</span>
      <div class="seg" role="group" aria-label="Jenis penerbangan"><button type="button" data-kind="dom" aria-pressed="${r.kind === 'dom'}">Domestik</button><button type="button" data-kind="int" aria-pressed="${r.kind === 'int'}">Internasional</button></div>
    </div>
    <div class="calc" aria-live="polite">
      <div class="sunball" aria-hidden="true"></div>
      <span class="demo-tag">Hitungan contoh</span>
      <div class="k" style="margin-top:12px">Berangkat dari Malang paling lambat</div>
      <div class="big">${jam(c.depart)}</div>
      <div class="k">${tgl(r.date)}</div>
      <ul class="steps">
        <li><span>Jam pesawat</span><b>${jam(r.flight)}</b></li>
        <li><span>Tiba di bandara (${durasi(c.buf)} sebelum)</span><b>${jam(c.arrive)}</b></li>
        <li><span>Waktu tempuh${c.wk ? ' (akhir pekan)' : ''}</span><b>${durasi(c.travel)}</b></li>
      </ul>
    </div>
    <button class="btn primary" type="submit">Cari slot yang cocok</button>
    <p class="note" style="margin:0">Angka buffer dan waktu tempuh bisa diatur admin di menu Akun. Versi nyata akan memakai data lalu lintas.</p>
  </form>`;
};

V.cocok = () => {
  const r = S.req, c = calc(r);
  const lo = c.depart - 60;
  const cands = S.slots.filter(s => s.route === 'mlg-sub' && s.date === r.date && s.status === 'open' && free(s) > 0 && toMin(s.time) >= lo - 60).sort((a, b) => a.time.localeCompare(b.time));
  const fit = cands.filter(s => toMin(s.time) >= lo && toMin(s.time) <= c.depart);
  const best = fit.length ? fit[fit.length - 1] : null;
  const card = s => {
    const t = toMin(s.time), diff = c.depart - t;
    const late = t > c.depart, early = t < lo;
    const label = s === best ? '<span class="pill open">Paling pas</span>' : late ? '<span class="pill wait">Terlalu mepet</span>' : early ? `<span class="pill full">Terlalu awal</span>` : `<span class="pill sky">${durasi(diff)} lebih awal</span>`;
    return `<div class="match ${s === best ? 'best' : ''} ${late ? 'late' : ''}">
      <div class="m-top"><span class="m-time">${jam(s.time)}</span>${label}</div>
      <div class="t-meta"><div>${ic('car', 15)}<span>${esc(s.op)} · ${free(s)} kursi kosong</span></div><div>${ic('pin', 15)}<span>Jemput di ${esc(s.area)}</span></div>${opVerified(s.op) ? '' : '<div>' + ic('shield', 15) + '<span>Izin mitra belum diverifikasi</span></div>'}</div>
      ${late ? '' : `<div class="btns"><button class="btn ${s === best ? 'primary' : 'ghost'} sm" data-take="${s.id}">Ambil kursi</button><button class="btn ghost sm" data-act="wa">${ic('chat', 18)}Chat</button></div>`}
    </div>`;
  };
  return `${topbar('Slot yang cocok', '#/minta')}
  <div class="req-sum"><b>${esc(r.name)} · Malang → Bandara Juanda</b><span>${tgl(r.date)} · pesawat ${r.kind === 'int' ? 'internasional' : 'domestik'} ${jam(r.flight)}</span><span style="color:var(--indigo);font-weight:700">Dicari berangkat ${jam(lo)}–${jam(c.depart)}</span></div>
  <div class="tickets">${cands.length ? cands.map(card).join('') : `<div class="empty"><b>Belum ada slot di rentang jam ini</b><p>Kirim permintaan ke jaringan supaya driver yang searah bisa membuka slot.</p><button class="btn primary sm" data-act="broadcast">Kirim ke jaringan</button></div>`}</div>`;
};

V.tiket = id => {
  const b = S.bookings.find(x => x.id === id);
  if (!b) return `${topbar('Pesanan', '#/aktivitas')}<div class="empty"><b>Pesanan tidak ditemukan</b><a class="btn primary sm" href="#/aktivitas">Lihat aktivitas</a></div>`;
  const r = ROUTES[b.route];
  return `${topbar('Kursi diamankan', '#/beranda')}
  <div class="pass">
    <div class="pass-top"><div class="sunball" style="position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--sun)"></div>
      <div class="code">Kode pesanan<b>${b.code}</b></div>
      <span class="ok">${ic('check', 14)}Kursi sudah tercatat</span>
    </div>
    <div class="t-perf" aria-hidden="true" style="margin-top:0"></div>
    <dl class="kv">
      <dt>Penumpang</dt><dd>${esc(b.name)}</dd>
      <dt>Rute</dt><dd>${r.from} → ${r.to}</dd>
      <dt>Tanggal</dt><dd>${tgl(b.date)}</dd>
      <dt>Berangkat</dt><dd>${jam(b.time)}</dd>
      <dt>Jemput di</dt><dd>${esc(b.area)}</dd>
      <dt>Mitra</dt><dd>${esc(b.op)}</dd>
      <dt>Driver</dt><dd>${esc(b.driver)}</dd>
      <dt>Pesawat</dt><dd>${jam(b.flight)} ${b.kind === 'int' ? 'internasional' : 'domestik'}</dd>
    </dl>
  </div>
  <div class="wrap" style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
    <button class="btn sun" data-act="share">${ic('chat', 18)}Kirim detail ke penumpang</button>
    <a class="btn ghost" href="#/beranda">Kembali ke beranda</a>
  </div>
  <p class="note">Pembayaran tetap diurus langsung dengan mitra selama trial.</p>`;
};

V.aktivitas = () => {
  const act = S.bookings.filter(b => b.status === 'active');
  const done = S.bookings.filter(b => b.status === 'done');
  const row = b => `<a class="li" href="#/tiket/${b.id}"><span class="av ${ROUTES[b.route].color}">${initial(b.name)}</span><span class="grow"><b>${esc(b.name)}</b><span>${ROUTES[b.route].short} · ${tglRel(b.date)} ${jam(b.time)}</span></span>${b.status === 'active' ? '<span class="pill sky">Dijadwalkan</span>' : '<span class="pill full">Selesai</span>'}</a>`;
  return `${topbar('Aktivitas')}
  <div class="section-h" style="margin-top:6px"><h2>Pesanan aktif</h2></div>
  ${act.length ? `<div class="list">${act.map(row).join('')}</div>` : `<div class="empty"><b>Belum ada pesanan aktif</b><p>Pesanan muncul di sini setelah kursi diambil untuk penumpang.</p><a class="btn primary sm" href="#/minta">Carikan kursi</a></div>`}
  <div class="section-h"><h2>Riwayat</h2></div>
  ${done.length ? `<div class="list">${done.map(row).join('')}</div>` : '<p class="sub">Belum ada riwayat.</p>'}`;
};

V.notif = () => `${topbar('Notifikasi', '#/beranda')}
  <div class="list">${S.notifs.map(n => `<a class="li ${n.unread ? 'unread' : ''}" href="${n.link}" data-notif="${n.id}"><span class="av ${n.tone}">${ic('bell', 18)}</span><span class="grow"><b>${esc(n.title)}</b><span>${esc(n.body)}</span></span>${ic('chev', 18)}</a>`).join('')}</div>
  <div class="wrap" style="margin-top:14px"><button class="btn ghost sm" data-act="readall">Tandai semua sudah dibaca</button></div>`;

V.akun = () => {
  const me = ROLES[S.role] || ROLES.agen, st = S.settings;
  return `${topbar('Akun')}
  <div class="list"><div class="li"><span class="av indigo" style="width:52px;height:52px;font-size:18px">${initial(me.name)}</span><span class="grow"><b style="font-size:17px">${esc(me.name)}</b><span>${me.label} · jaringan travel Malang Raya</span></span></div></div>
  <div class="section-h"><h2>Jaringan saya</h2><span style="font-size:13px;color:var(--ink-2)">${OPS.length} mitra</span></div>
  <div class="list">${OPS.map((o, i) => `<div class="li"><span class="av ${['sky', 'rose', 'amber', 'leaf'][i]}">${o.name.slice(-1)}</span><span class="grow"><b>${o.name}</b><span>${S.slots.filter(s => s.op === o.name).length} slot di papan</span></span>${o.verified ? '<span class="pill open">' + ic('shield', 14) + 'Izin ok</span>' : '<span class="pill wait">Menunggu</span>'}</div>`).join('')}</div>
  <div class="section-h"><h2>Aturan hitung jam</h2></div>
  <div class="list" id="settings">
    <div class="setting"><label for="s-dom">Tiba sebelum pesawat domestik<small>dalam menit</small></label><input class="input" id="s-dom" type="number" min="30" step="15" value="${st.bufDom}"></div>
    <div class="setting"><label for="s-int">Tiba sebelum pesawat internasional<small>dalam menit</small></label><input class="input" id="s-int" type="number" min="30" step="15" value="${st.bufInt}"></div>
    <div class="setting"><label for="s-base">Waktu tempuh Malang–Juanda<small>dalam menit</small></label><input class="input" id="s-base" type="number" min="30" step="15" value="${st.base}"></div>
    <div class="setting"><label for="s-wk">Tambahan saat akhir pekan<small>dalam menit</small></label><input class="input" id="s-wk" type="number" min="0" step="15" value="${st.weekendAdd}"></div>
  </div>
  <p class="note">Nilai awal hanya contoh, berdasarkan panduan umum tiba 2–3 jam sebelum terbang dan perjalanan sekitar 2–3 jam. Sesuaikan dengan pengalaman driver.</p>
  <div class="section-h"><h2>Lainnya</h2></div>
  <div class="list">
    <a class="li" href="peta.html"><span class="av sun">${ic('map', 18)}</span><span class="grow"><b>Peta halaman</b><span>Hubungan antar halaman di dummy ini</span></span>${ic('chev', 18)}</a>
    <button class="li" style="width:100%;border:none;background:none;text-align:left" data-act="switch"><span class="av indigo">${ic('swap', 18)}</span><span class="grow"><b>Ganti peran</b><span>Coba sebagai agen, driver atau admin</span></span>${ic('chev', 18)}</button>
    <button class="li" style="width:100%;border:none;border-top:1px solid var(--line);background:none;text-align:left" data-act="reset"><span class="av rose">${ic('reset', 18)}</span><span class="grow"><b>Reset data contoh</b><span>Kembalikan semua slot dan pesanan awal</span></span>${ic('chev', 18)}</button>
  </div>`;
};

/* ---------- Router ---------- */
const TABS = [
  { href: '#/beranda', label: 'Beranda', icon: 'home', match: ['beranda', 'notif'] },
  { href: '#/papan', label: 'Papan', icon: 'board', match: ['papan', 'slot'] },
  { fab: true },
  { href: '#/aktivitas', label: 'Aktivitas', icon: 'list', match: ['aktivitas', 'tiket'] },
  { href: '#/akun', label: 'Akun', icon: 'user', match: ['akun'] }
];
function render() {
  const [, page = '', arg] = (location.hash || '#/').split('/');
  const app = document.getElementById('app'), tab = document.getElementById('tabbar');
  let p = page;
  if (!S.role && p !== '') p = '';
  if (S.role && p === '') p = 'beranda';
  if (!V[p] && p !== '') p = 'beranda';
  const isWelcome = p === '';
  app.innerHTML = isWelcome ? V.welcome() : V[p](arg);
  app.classList.toggle('no-tab', isWelcome);
  tab.hidden = isWelcome;
  tab.innerHTML = TABS.map(t => t.fab ? `<button class="fab" data-act="sheet" aria-label="Buat baru">${ic('plus', 26)}</button>` : `<a href="${t.href}" ${t.match.includes(p) ? 'aria-current="page"' : ''}>${ic(t.icon, 22)}<span>${t.label}</span></a>`).join('');
  app.scrollTop = 0;
  const h1 = app.querySelector('h1'); if (h1) document.title = h1.textContent + ' · TravelMlg (dummy)';
}
window.addEventListener('hashchange', render);

/* ---------- Interaksi ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = ic('check', 18) + '<span>' + esc(msg) + '</span>';
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}
function openSheet() {
  const sc = document.getElementById('scrim');
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Buat baru"><div class="grab"></div><h2>Mau buat apa?</h2>
    <a href="#/buka"><span class="av sun">${ic('plus', 20)}</span><span><b>Buka slot</b>Umumkan kursi kosong di armadamu</span></a>
    <a href="#/minta"><span class="av sky">${ic('plane', 20)}</span><span><b>Carikan kursi ke bandara</b>Hitung jam berangkat dari jadwal pesawat</span></a>
    <a href="#/papan"><span class="av rose">${ic('board', 20)}</span><span><b>Cari slot antarkota</b>Kediri, Blitar, Jember dan lainnya</span></a></div>`;
  sc.hidden = false;
  sc.querySelector('a').focus();
}
const closeSheet = () => { const sc = document.getElementById('scrim'); sc.hidden = true; sc.innerHTML = ''; };
document.getElementById('scrim').addEventListener('click', e => { if (e.target.id === 'scrim' || e.target.closest('a')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function readReq() {
  const g = id => document.getElementById(id);
  if (!g('r-name')) return;
  S.req.name = g('r-name').value; S.req.phone = g('r-phone').value; S.req.area = g('r-area').value;
  S.req.date = g('r-date').value; S.req.flight = g('r-flight').value || S.req.flight; save();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; save(); location.hash = '#/beranda'; render(); return; }
  if (d.date) { S.filter.date = d.date; save(); render(); return; }
  if (d.route) { S.filter.route = d.route; save(); render(); return; }
  if (d.kind) { readReq(); S.req.kind = d.kind; save(); render(); document.querySelector(`[data-kind="${d.kind}"]`).focus(); return; }
  if (d.step) { const o = document.getElementById('b-seat'); const v = Math.min(14, Math.max(1, parseInt(o.textContent) + Number(d.step))); o.innerHTML = v + '<small>kursi</small>'; return; }
  if (d.notif) { const n = S.notifs.find(x => x.id === d.notif); if (n) { n.unread = false; save(); } return; }
  if (d.take) {
    const s = S.slots.find(x => x.id === d.take); const r = S.req;
    s.taken.push(r.name || 'Penumpang');
    const id = 'b' + Date.now();
    const code = 'TM-' + Math.floor(1000 + Math.random() * 9000);
    S.bookings.unshift({ id, code, name: r.name || 'Penumpang', phone: r.phone, area: r.area, route: s.route, date: s.date, time: s.time, op: s.op, driver: s.driver, flight: r.flight, kind: r.kind, status: 'active' });
    S.notifs.unshift({ id: 'n' + Date.now(), title: `Kursi diambil untuk ${r.name}`, body: `${ROUTES[s.route].short} · ${tglRel(s.date)} ${jam(s.time)} · ${s.op}`, unread: true, link: '#/tiket/' + id, tone: 'leaf' });
    save(); location.hash = '#/tiket/' + id; return;
  }
  switch (d.act) {
    case 'sheet': openSheet(); break;
    case 'wa': toast('Di versi nyata, tombol ini membuka WhatsApp driver'); break;
    case 'share': toast('Di versi nyata, detail dikirim lewat WhatsApp'); break;
    case 'broadcast': toast('Permintaan dikirim ke semua anggota jaringan'); break;
    case 'close': case 'reopen': { const s = S.slots.find(x => x.id === d.id); s.status = d.act === 'close' ? 'closed' : 'open'; save(); render(); toast(d.act === 'close' ? 'Slot ditutup' : 'Slot dibuka lagi'); break; }
    case 'readall': S.notifs.forEach(n => n.unread = false); save(); render(); toast('Semua notifikasi sudah dibaca'); break;
    case 'switch': S.role = null; save(); location.hash = '#/'; render(); break;
    case 'reset': { const r = S.role; S = seed(); S.role = r; S.seedDay = TODAY; save(); render(); toast('Data contoh dikembalikan'); break; }
  }
});

document.addEventListener('input', e => {
  if (e.target.closest('#f-minta')) {
    readReq();
    if (['r-date', 'r-flight'].includes(e.target.id)) { const keep = e.target.id; render(); const el = document.getElementById(keep); if (el) el.focus(); }
  }
  if (e.target.closest('#settings')) {
    const v = id => Math.max(0, parseInt(document.getElementById(id).value) || 0);
    S.settings = { bufDom: v('s-dom'), bufInt: v('s-int'), base: v('s-base'), weekendAdd: v('s-wk') }; save();
  }
  if (e.target.matches('.input[aria-invalid="true"]') && e.target.value.trim()) {
    e.target.setAttribute('aria-invalid', 'false');
    const er = document.getElementById(e.target.id + '-e'); if (er) er.hidden = true;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const need = (id) => { const el = document.getElementById(id); if (!el.value.trim()) { el.setAttribute('aria-invalid', 'true'); document.getElementById(id + '-e').hidden = false; return el; } return null; };
  if (e.target.id === 'f-buka') {
    const bad = need('b-area'); if (bad) { bad.focus(); return; }
    const g = id => document.getElementById(id).value;
    const id = 's' + Date.now();
    S.slots.push({ id, route: g('b-route'), date: g('b-date'), time: g('b-time') || '08:00', seats: parseInt(document.getElementById('b-seat').textContent), taken: [], op: g('b-op'), driver: g('b-driver') || 'Driver', plate: 'N xxxx', area: g('b-area'), status: 'open', note: g('b-note') });
    S.notifs.unshift({ id: 'n' + Date.now(), title: `Slot baru: ${ROUTES[g('b-route')].short} ${jam(g('b-time') || '08:00')}`, body: `${g('b-op')} · ${tglRel(g('b-date'))}`, unread: true, link: '#/slot/' + id, tone: 'sun' });
    S.filter = { date: g('b-date'), route: 'all' };
    save(); location.hash = '#/slot/' + id; setTimeout(() => toast('Slot terbit di papan jaringan'), 50);
  }
  if (e.target.id === 'f-minta') {
    readReq();
    const bad = need('r-name') || need('r-area'); if (bad) { bad.focus(); return; }
    location.hash = '#/cocok';
  }
});

render();
</script>
</body>
</html>
